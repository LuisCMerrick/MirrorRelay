services:
  mirrorrelay:
    image: luiscmerrick/mirrorrelay:${MIRRORRELAY_IMAGE_TAG:-latest}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      MIRRORRELAY_ADMIN_HOST: ${MIRRORRELAY_ADMIN_HOST:-}
    ports:
      - "127.0.0.1:${MIRRORRELAY_FRONTEND_PORT:-9081}:9081"
    tmpfs:
      - /run/mirrorrelay:rw,nosuid,nodev,noexec,mode=0770,uid=65532,gid=65532
    volumes:
      - ./configs/config.docker.yaml:/etc/mirrorrelay/config.yaml:ro
      - mirrorrelay-data:/var/lib/mirrorrelay
      - mirrorrelay-cache:/var/cache/mirrorrelay
      - mirrorrelay-logs:/var/log/mirrorrelay

volumes:
  mirrorrelay-data:
  mirrorrelay-cache:
  mirrorrelay-logs:

networks:
  default:
    ipam:
      config:
        - subnet: ${MIRRORRELAY_DOCKER_SUBNET:-172.31.255.0/24}
          gateway: ${MIRRORRELAY_DOCKER_GATEWAY:-172.31.255.1}
