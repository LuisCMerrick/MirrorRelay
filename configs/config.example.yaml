server:
  unix_socket_enabled: true
  frontend_socket: "/run/mirrorrelay/frontend.sock"
  frontend_socket_mode: "0660"
  local_port: 9081
runtime:
  root: "/var/lib/mirrorrelay/runtime"
  run_dir: "/run/mirrorrelay"
ingress:
  mode: external
  generate_snippet: true
  snippet_path: "/var/lib/mirrorrelay/integration/external-nginx"
performance:
  stream_buffer_size_bytes: 65536
  go_memory_limit_bytes: 0
  gogc: 100
metadata:
  rewrite_buffer_limit_bytes: 8388608
  output_compression: auto
  gzip_min_length_bytes: 1024
  validator_entries: 2048
redirect:
  max_hops: 5
  pin_validated_ip: true
  reject_mixed_dns_result: true
http:
  listen: ":80"
  https_listen: ":443"
  public_base_url: "https://mirror.example.com"
  read_timeout: 15s
  write_timeout: 0s
  idle_timeout: 2m
tls:
  certificate: "/etc/mirrorrelay/certs/fullchain.pem"
  private_key: "/etc/mirrorrelay/certs/privkey.pem"
  min_version: "1.2"
database:
  path: "/var/lib/mirrorrelay/mirrorrelay.db"
cache:
  path: "/var/cache/mirrorrelay"
  max_size_bytes: 536870912000
  max_files: 1000000
  inactive: 720h
  metadata_ttl: 5m
  package_ttl: 720h
  cleanup_interval: 10m
  wait_for_fill: 30m
  minimum_free_bytes: 1073741824
logging:
  path: "/var/log/mirrorrelay"
  queue_size: 8192
  max_size_mb: 1024
  keep_days: 30
security:
  allow_http_upstream: false
  allow_private_upstream: false
  expose_client_ip: false
  session_timeout: 12h
  login_window: 15m
  login_max_failures: 5
  admin_cidrs: []
transport:
  dial_timeout: 10s
  keep_alive: 30s
  tls_handshake_timeout: 10s
  response_header_timeout: 30s
  idle_connection_timeout: 90s
  max_idle_connections: 512
  max_idle_connections_per_host: 64
limits:
  max_total_concurrency: 0
  max_ip_concurrency: 0
  bandwidth_limit_bps: 0
health:
  worker_interval: 15s
admin:
  host: ""
  path: /admin/
  initial_username: "admin"
  initial_password: ""
shutdown:
  grace_period: 30m
upstream_nginx:
  mode: managed
  binary: /usr/lib/mirrorrelay/nginx/nginx
  prefix: /var/lib/mirrorrelay/runtime/upstream-nginx
  pid: /run/mirrorrelay/upstream-nginx.pid
  log_path: /var/log/mirrorrelay/upstream-nginx
  upstream_unix_socket_enabled: true
  upstream_socket: /run/mirrorrelay/upstream.sock
  upstream_socket_mode: "0600"
  upstream_local_port: 9082
  ca_bundle: /etc/ssl/certs/ca-certificates.crt
  tls_verify_depth: 5
  resolver: "1.1.1.1 8.8.8.8"
  resolver_refresh: 5m
  history_limit: 20
  restart_max_failures: 5
  restart_window: 2m
  restart_initial_backoff: 1s
  restart_max_backoff: 30s
  worker_processes: auto
  worker_user: mirrorrelay
  worker_connections: 4096
  stop_on_mirrorrelay_exit: false
distributed:
  enabled: false
  role: standalone
  token: ""
  allow_http: false
  node:
    name: "node-01"
    public_base_url: "https://mirror.example.com"
    region: "default"
    country: ""
  routing:
    mode: hybrid
    regions: []
    client_networks: []
  health_check:
    interval: 10s
    timeout: 3s
    healthy_threshold: 2
    unhealthy_threshold: 3
  nodes: []
webhook:
  enabled: false
  url: ""
  secret: ""
  events: [upstream_status, cache_threshold, config_change, security_alert]
  timeout: 5s
  allow_http: false
  allow_private: false
